<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Hub - TechPath</title>
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/style.css">
    <script src="/socket.io/socket.io.js"></script>

    <style>
        .team-layout {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: var(--spacing-xl);
            margin-top: var(--spacing-xl);
            height: calc(100vh - 140px);
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: var(--spacing-lg);
            background: rgba(255, 255, 255, 0.02);
            border-radius: var(--radius-lg);
            margin-bottom: var(--spacing-md);
            display: flex;
            flex-direction: column;
            border: 1px solid var(--glass-border);
        }

        .chat-input-area {
            display: flex;
            gap: var(--spacing-sm);
        }

        @media (max-width: 768px) {
            .team-layout {
                grid-template-columns: 1fr;
                height: auto;
            }
            .chat-container {
                height: 500px;
            }
        }
    </style>
</head>
<body class="page-load">
    <div class="bg-mesh"></div>

    <header class="site-header navbar-glass">
        <div class="header-inner">
            <a href="teams.html" class="logo" style="font-size: 1.2rem; gap: 10px;">
                <span style="font-size: 1.3rem;">⬅️</span> Back to Teams
            </a>
            <h2 id="team-name" style="margin: 0; margin-left: auto;" class="gradient-text">Loading Team...</h2>
        </div>
    </header>

    <main>
        <div class="section-inner" style="padding: 1.5rem 2rem;">
        <div class="team-layout">
            <!-- Left Side: Chat & Main Content -->
            <div class="card-glass chat-container">
                <div style="border-bottom: 1px solid var(--glass-border); padding-bottom: 14px; margin-bottom: 14px;">
                    <h3 style="margin:0;">💬 <span style="color:var(--primary);">Team Chat</span></h3>
                </div>

                <div id="chat-messages" class="chat-messages">
                    <div style="display:flex; justify-content:center; align-items:center; height:100%;">
                        <div class="loader-primary"></div>
                    </div>
                </div>

                <div class="chat-input-area">
                    <input type="text" id="message-input" class="form-input" placeholder="Type a message..." style="border-radius: var(--radius-full);">
                    <button id="send-btn" class="btn-primary" style="border-radius: var(--radius-full); padding: 0 28px;">Send</button>
                </div>
            </div>

            <!-- Right Side: Members & Stats -->
            <div style="display: flex; flex-direction: column; gap: var(--spacing-lg);">

                <!-- Stats Card -->
                <div class="card-glass stagger-item" style="--i: 1; padding: 2rem;">
                    <h4 style="margin-bottom: 18px; border-bottom: 1px solid var(--glass-border); padding-bottom: 10px;">📊 Team Stats</h4>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                        <span style="color: var(--text-muted);">Members</span>
                        <span id="team-members-count" style="font-weight: bold;">-</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px;">
                        <span style="color: var(--text-muted);">Active Streak</span>
                        <span style="font-weight: bold; display: flex; align-items: center; gap: 4px;">
                            <span id="team-streak" style="color: var(--warning);">-</span> <span style="color: var(--warning);">Days</span> <span class="streak-fire">🔥</span>
                        </span>
                    </div>

                    <div class="team-progress-container" style="border-top: 1px solid var(--glass-border); padding-top: 14px;">
                        <div class="team-progress-header">
                            <span>Overall Progress</span>
                            <span id="overall-progress-text" style="color: var(--primary); font-weight: 700;">72%</span>
                        </div>
                        <div class="team-progress-bg">
                            <div id="overall-progress-fill" class="team-progress-fill" style="width: 72%;"></div>
                        </div>
                    </div>
                </div>

                <!-- Motivation Card -->
                <div class="card-glass stagger-item" style="--i: 2; text-align: center; padding: 2rem;">
                    <div style="font-size: 3rem; margin-bottom: 14px; display: flex; justify-content: center; gap: 12px;">
                        👨‍💻 🙌 👩‍💻
                    </div>
                    <p id="motivational-quote" style="font-style: italic; color: var(--primary); font-size: 0.95rem; margin-bottom: 0; line-height: 1.6;">
                        "Alone we can do so little; together we can do so much."
                    </p>
                </div>

                <!-- Members Card -->
                <div class="card-glass stagger-item" style="--i: 3; flex-grow: 1; padding: 2rem;">
                    <h4 style="margin-bottom: 18px; border-bottom: 1px solid var(--glass-border); padding-bottom: 10px;">👥 Members</h4>
                    <div id="members-list" style="overflow-y: auto; max-height: 300px;">
                        <div class="skeleton" style="height: 40px; margin-bottom: 10px;"></div>
                        <div class="skeleton" style="height: 40px; margin-bottom: 10px;"></div>
                    </div>
                </div>

            </div>
        </div>
        </div>
    </main>

    <script src="../js/chat.js"></script>
</body>
</html>
